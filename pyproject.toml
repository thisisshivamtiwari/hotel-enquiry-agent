[project]
name = "hotel-enquiry-agent"
version = "0.1.0"
description = "Replying to hotel guest enquiries with an LLM: one-shot prompt vs a tool-grounded agent vs tools + deterministic checks, repair and handoff rules, measured on a made-up hotel"
readme = "README.md"
authors = [
    { name = "Shivam Tiwari" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "enquiry_agent"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
