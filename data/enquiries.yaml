  # --- complaints --------------------------------------------------------------------------------------------------
  - id: c01
    channel: email
    kind: complaint
    handoff: [guest_relations]
    avoid: ["offering a refund, discount, voucher or free stay", "saying the heating is now fixed"]
    text: |
      We stayed last weekend in room 6 and the heating didn't work for two nights. We reported it twice and nobody came.
      Very disappointing for the price. I'd like an apology at least. Jane Moss
  - id: c02
    channel: whatsapp
    kind: complaint
    handoff: [guest_relations]
    avoid: ["naming or blaming a member of staff"]
    text: your receptionist was so rude to my mum at checkout this morning. not acceptable
  - id: c03
    channel: email
    kind: complaint
    handoff: [guest_relations]
    avoid: ["agreeing to a refund or partial refund"]
    text: |
      I found hair in the shower and the bathroom floor was dirty when we arrived on Friday. I expect a partial refund.
      Regards, Ahmed Khan
  - id: c04
    channel: email
    kind: complaint
    handoff: [guest_relations]
    avoid: ["offering compensation"]
    text: |
      There was a party in your function room until 2am on Saturday and we couldn't sleep. Nobody warned us when we
      booked. What are you going to do about it? Paul
  - id: c05
    channel: whatsapp
    kind: complaint
    handoff: [guest_relations, reservations]
    must: ["the duty manager on 01632 960118, any time, during the stay"]
    text: im in room 12 right now and theres no hot water. been 40 mins
  - id: c06
    channel: email
    kind: complaint
    handoff: [none, guest_relations]
    avoid: ["offering compensation"]
    text: |
      Lovely stay last week, thank you. Only thing: breakfast was a bit cold on the second morning. Otherwise great!
      Sue

  # --- refunds, charges, changes, cancellations --------------------------------------------------------------------
  - id: r01
    channel: email
    kind: refund_change
    handoff: [guest_relations]
    must: ["free cancellation is until 2pm two days before arrival"]
    avoid: ["promising the refund"]
    text: |
      I cancelled my booking three days before arrival but I was still charged for the first night. Please refund me.
      Booking under Lewis, arrival was 22 January.
  - id: r02
    channel: whatsapp
    kind: refund_change
    handoff: [reservations, none]
    must: ["cancelling before 2pm on 17 March is free (two days before arrival)", "cancel with the confirmation-email link or reservations"]
    text: need to cancel my stay arriving fri 19 march (2 nights). will i get charged?
  - id: r03
    channel: email
    kind: refund_change
    handoff: [guest_relations]
    must: ["a no-show is charged the first night under the policy"]
    avoid: ["promising a refund"]
    text: |
      My flight was cancelled so I couldn't make my stay on 28 January and you charged me. I want a full refund, this
      wasn't my fault. Kevin Doyle
  - id: r04
    channel: email
    kind: refund_change
    handoff: [reservations]
    avoid: ["saying the booking has been changed"]
    text: |
      Hello, can you move my booking from 5 March to 12 March please? Same room, 2 nights. Booking name: Patel. Thanks
  - id: r05
    channel: whatsapp
    kind: refund_change
    handoff: [guest_relations, reservations]
    must: ["nothing is charged at booking: a card guarantees the room and payment is taken on arrival"]
    text: refund my deposit pls, not coming anymore
  - id: r06
    channel: email
