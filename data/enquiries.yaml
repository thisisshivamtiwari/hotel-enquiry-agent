# 51 made-up guest enquiries to the made-up Fernhollow House (data/hotel.yaml), as of Monday 1 February 2027.
# Every person, booking and situation is invented.
#
# kind:     booking | group_event | complaint | refund_change | request | off_topic | injection
# handoff:  the acceptable handoff values for a reply (none = the reply desk answers it alone)
# asks:     availability lookups whose results are the ground truth for any price or availability in the reply
# must:     facts from the policy page a good reply gives (the judge checks them)
# avoid:    things a reply must not do (the judge checks them; checks.py tests some deterministically)
enquiries:
  # --- availability and price --------------------------------------------------------------------------------------
  - id: b01
    channel: email
    kind: booking
    handoff: [none]
    asks: [{check_in: "2027-03-05", nights: 2, adults: 2}]
